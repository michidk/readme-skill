/* === HyperWeave Accessibility Layer ===
 * Non-negotiable media queries for motion, color scheme, and forced colors.
 * Included in EVERY artifact.
 *
 * CAMO NOTE (corrected 2026-08-30): an SVG served as an img — GitHub's Camo
 * proxy included — evaluates @media (prefers-color-scheme) against the
 * EMBEDDING element's used color-scheme (Media Queries 5; CSSWG #7213).
 * Chromium and Firefox implement this, so the adaptive flip works in GitHub
 * READMEs there (owner-observed on github.com, 2026-08-30). WebKit does not
 * evaluate it in image contexts (wpt Interop #1058), so Safari and iOS
 * readers get the artifact's BASE face — the recorded iPhone 13 behavior.
 * Treat the single-file flip as progressive enhancement; the committed-face
 * picture pair stays the cross-engine delivery. forced-colors remains
 * unreliable in image contexts (CSSWG #10331). An img context also loads NO
 * external resources of any kind, which is why the cdn font mode and
 * github-readme delivery are mutually exclusive.
 *
 * Inline, object, and standalone embeds evaluate every query everywhere.
 */
/* ── Reduced Motion ── */
@media (prefers-reduced-motion: reduce) {*, *::before, *::after {
    
    
    transition-duration: 0.01ms !important;
  }
animate, animateTransform, animateMotion, set {
    display: none !important;
  }}
/* ── Light Mode Override (see CAMO NOTE above — inert through img) ── */
/* Light mode: genome alleles injected by CSS assembler into per-artifact @media block. */
/* ── Forced Colors (Windows High Contrast) ── */
@media (forced-colors: active) {text { fill: CanvasText !important; }
rect, path, circle, ellipse, polygon, polyline, line {
    stroke: CanvasText !important;
  }}</style>
