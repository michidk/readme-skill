  <hw:reasoning xmlns:hw="https://hyperweave.app/hw/v1.0">
    <hw:intent>The same topology grammar on light paper: white cards lifted by a
two-layer drop shadow, royal-blue signal hero ring, 600-700-level
flow hues against the pale ground; the explanatory sibling of the
porcelain matrix.</hw:intent>
    <hw:approach>Identical chassis solve as the dark substrate (the geometry is
substrate-blind): 64px fan pitch, 92px convergence pitch meeting
at one point on the hero&apos;s facing edge, sequence lifelines at a
255px gap with 56px message pitch on a 5.236s replay clock.
Cards bind --dna-surface-alt over --dna-border hairlines; node
dots and branch strokes cycle the genome diagram_flow palette by
non-hero order.</hw:approach>
    <hw:tradeoffs>The 6 percent lift shadow that seats cards on light paper is a
literal genome value (var() never resolves in filter attributes),
so per-variant shadow retunes are config edits, not CSS; muted
comparison cards drop their accent dot entirely, trading slot
symmetry for the inert-versus-live read the topology exists to
assert.</hw:tradeoffs>
    <hw:constraints-applied>system-fonts, cim-compliant, wcag-aa</hw:constraints-applied>
    <hw:spatial-notes>400x525, render 322x422; bottom-to-top stack; 3 nodes, 2 edges</hw:spatial-notes>
  </hw:reasoning>
