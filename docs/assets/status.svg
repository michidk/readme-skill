/* === HyperWeave Bridge Classes ===
 * Maps semantic class names (hw-*) to genome DNA custom properties (--dna-*).
 * Genome-agnostic: works with ANY genome that defines the --dna-* contract.
 */
/* ── Surface fills ── */
/* ── Signal / Accent ── */
/* ── Ink / Typography ── */
/* ── Border / Separator ── */
/* ── Status ── */
/* ── Extended ── */
/* === HyperWeave Expression Layer ===
 * CSS state machine driven by data-hw-* attributes.
 * Genome-agnostic: all colors via --dna-* custom properties.
 */
/* ── Text Rendering (iOS/WebKit blur mitigation) ── */
text {
  text-rendering: geometricPrecision;
  -webkit-font-smoothing: antialiased;
  shape-rendering: geometricPrecision;
}
/* ── Typography ── */
/* ── Structural ── */
/* ── Status ── */
/* ── Glyph ── */
/* === Status Phenotype === */
[data-hw-status="active"]   { --dna-status-color: #15803D; }
[data-hw-status="passing"]  { --dna-status-color: #15803D; }
[data-hw-status="building"] { --dna-status-color: #1D4ED8; }
[data-hw-status="warning"]  { --dna-status-color: #B45309; }
[data-hw-status="critical"] { --dna-status-color: #DC2626; }
[data-hw-status="failing"]  { --dna-status-color: #DC2626; }
[data-hw-status="offline"]  { --dna-status-color: #537395; }
svg[data-hw-status="warning"]  { filter: drop-shadow(0 0 4px rgba(245,158,11,0.3)); }
svg[data-hw-status="critical"],
svg[data-hw-status="failing"]  { filter: drop-shadow(0 0 5px rgba(220,38,38,0.4)); }
svg[data-hw-status="offline"]  { opacity: .65; filter: grayscale(45%); }
/* === Badge State Machine v2 === */
[data-hw-status="active"], [data-hw-status="passing"] {
  --hw-state-core: #15803D;
  --hw-state-sep: #1D4ED8;
  --hw-state-ring: #1D4ED8;
  --hw-state-value: #1E3A5F;
  --hw-state-signal: #1D4ED8;
  --hw-state-specular: #1D4ED8;
  --hw-state-sweep: #1D4ED8;
}
[data-hw-status="warning"] {
  --hw-state-core: #B45309;
  --hw-state-sep: #B45309;
  --hw-state-ring: #B45309;
  --hw-state-value: #FDE68A;
  --hw-state-signal: #B45309;
  --hw-state-specular: #B45309;
  --hw-state-sweep: #B45309;
}
[data-hw-status="critical"], [data-hw-status="failing"] {
  --hw-state-core: #DC2626;
  --hw-state-sep: #DC2626;
  --hw-state-ring: #DC2626;
  --hw-state-value: #FCA5A5;
  --hw-state-signal: #DC2626;
  --hw-state-specular: #DC2626;
  --hw-state-sweep: #DC2626;
}
/* Default (neutral/offline/building). Pre-v0.3.0 these all routed through
   --dna-signal (indicator) and --dna-badge-value-text (text) — both
   variant-blind for automata (genome.accent + genome.badge_value_text stay
   static teal regardless of ?variant=bone|steel|phosphor|amber|...).
   v0.3.0 introduces TWO variant-aware fallbacks: --hw-state-tone (indicator
   color, = primary.seam_mid) and --hw-state-value-tone (text color, =
   primary.value_text). Both set on the SVG root via inline style by the
   resolver dispatcher for cellular paradigm. When unset (chrome, brutalist),
   they fall back to the pre-v0.3 vars. */
svg:not([data-hw-status="active"]):not([data-hw-status="passing"]):not([data-hw-status="warning"]):not([data-hw-status="critical"]):not([data-hw-status="failing"]) {
  --hw-state-core: #1D4ED8;
  --hw-state-sep: #1D4ED8;
  --hw-state-ring: #1D4ED8;
  --hw-state-value: #1E3A5F;
  --hw-state-signal: #1D4ED8;
  --hw-state-specular: #1D4ED8;
  --hw-state-sweep: #1D4ED8;
}
/* === Badge Element Classes === */
/* State tint overlay on right panel */
/* === Living Value: Threshold State Machine ===
 * v0.2.25: gated by data-hw-statemode="auto" so leading-digit auto-
 * inference fires ONLY for stateful badges (build/coverage/uptime/
 * health/score/lint/ci/deploy/status). A STARS=6 badge has
 * data-hw-statemode="off" and these selectors don't match —
 * preventing the orange-warning false alarm on data-driven badges
 * whose values happen to start with a "6" or "7".
 *
 * Explicit-mode badges (data-hw-statemode="explicit", set by ?state=)
 * also bypass threshold inference: the user owns the state. */
[data-hw-statemode="auto"][data-hw-value^="9"],
[data-hw-statemode="auto"][data-hw-value^="8"] {
  --dna-status-color: #15803D;
}
[data-hw-statemode="auto"][data-hw-value^="7"],
[data-hw-statemode="auto"][data-hw-value^="6"] {
  --dna-status-color: #B45309;
}
[data-hw-statemode="auto"][data-hw-value^="5"],
[data-hw-statemode="auto"][data-hw-value^="4"],
[data-hw-statemode="auto"][data-hw-value^="3"],
[data-hw-statemode="auto"][data-hw-value^="2"],
[data-hw-statemode="auto"][data-hw-value^="1"],
[data-hw-statemode="auto"][data-hw-value^="0"] {
  --dna-status-color: #DC2626;
}
/* === HyperWeave Status Indicator Animations ===
 * State-dependent animation speeds for .hw-logic-bit
 * Active: slow breathe. Warning: medium pulse. Critical: fast strobe.
 */
/* Active/passing: slow breathe 2s */
/* Warning: medium pulse 0.9s */
/* Critical/failing: strobe 0.35s */
/* Building: faster breathe 1.5s */
/* Offline: no animation */
/* === Keyframes === */
/* === HyperWeave Accessibility Layer ===
 * Non-negotiable media queries for motion, color scheme, and forced colors.
 * Included in EVERY artifact.
 *
 * CAMO NOTE (corrected 2026-08-30): an SVG served as an img — GitHub's Camo
 * proxy included — evaluates @media (prefers-color-scheme) against the
 * EMBEDDING element's used color-scheme (Media Queries 5; CSSWG #7213).
 * Chromium and Firefox implement this, so the adaptive flip works in GitHub
 * READMEs there (owner-observed on github.com, 2026-08-30). WebKit does not
 * evaluate it in image contexts (wpt Interop #1058), so Safari and iOS
 * readers get the artifact's BASE face — the recorded iPhone 13 behavior.
 * Treat the single-file flip as progressive enhancement; the committed-face
 * picture pair stays the cross-engine delivery. forced-colors remains
 * unreliable in image contexts (CSSWG #10331). An img context also loads NO
 * external resources of any kind, which is why the cdn font mode and
 * github-readme delivery are mutually exclusive.
 *
 * Inline, object, and standalone embeds evaluate every query everywhere.
 */
/* ── Reduced Motion ── */
@media (prefers-reduced-motion: reduce) {*, *::before, *::after {
    
    
    transition-duration: 0.01ms !important;
  }
animate, animateTransform, animateMotion, set {
    display: none !important;
  }}
/* ── Light Mode Override (see CAMO NOTE above — inert through img) ── */
/* Light mode: genome alleles injected by CSS assembler into per-artifact @media block. */
/* ── Forced Colors (Windows High Contrast) ── */
@media (forced-colors: active) {text { fill: CanvasText !important; }
rect, path, circle, ellipse, polygon, polyline, line {
    stroke: CanvasText !important;
  }}</style>
