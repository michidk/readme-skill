  <hw:reasoning xmlns:hw="https://hyperweave.app/hw/v1.0">
    <hw:intent>The same 20px two-plate rail with the white-on-white seam — the split
reads as a pressed crease in the white ground (ink at 0.09 + white at
0.85), not a drawn rule, so eight variants share one anatomy.</hw:intent>
    <hw:approach>Label plate tinted rgba(ink,0.03); seam = 1px ink-0.09 groove + 1px
white-0.85 shine; inner white-0.55 highlight inset 0.6 at rx 3.4 under
a 1px stroke border; a hair drop-shadow (shadow_color at 0.16, dy 0.5
blur 1) lifts the chip off the README white.</hw:approach>
    <hw:tradeoffs>White-on-white plates instead of a surface_2 tone block — a tone block
reads as a generic two-tone shields badge. Mono label runs muted
ink_secondary, not accent: one accent family per chip (the glyph),
not three.</hw:tradeoffs>
    <hw:constraints-applied>system-fonts, cim-compliant, wcag-aa</hw:constraints-applied>
    <hw:spatial-notes>159x20 (7.95), left-to-right</hw:spatial-notes>
  </hw:reasoning>
