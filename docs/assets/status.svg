   Specimen-derived timings: ping 2.2s, spin .9s, throb 1.0s, shake .65s. */
.hw-pri-ping{transform-box:fill-box;transform-origin:center;will-change:transform,opacity}
.hw-pri-ping2{transform-box:fill-box;transform-origin:center;will-change:transform,opacity}

@media (prefers-reduced-motion:reduce){.hw-pri-ping,.hw-pri-ping2 {}}</style>
